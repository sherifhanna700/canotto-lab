<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Canotto Lab</title>
  <meta name="description" content="Plan, run and compare contemporary canotto pizza doughs. Flour-aware recipes, a fermentation model, and a bake log that tells you which permutation actually worked.">
  <meta name="theme-color" content="#A33E18">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <script>
    // Resolve the theme before the first paint so there is no flash of the
    // wrong one. Kept in its own key so this can run without loading the app.
    (function () {
      try {
        var pref = localStorage.getItem('canotto-lab/theme') || 'system';
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="stylesheet" href="assets/style.css?v=b05e27a1">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="appbar">
  <header class="topbar">
    <div class="brand">
      <span class="msym brand-mark" aria-hidden="true">local_pizza</span>
      <div>
        <h1>Canotto Lab</h1>
        <p id="brand-sub">Contemporary Canotto</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="progress-chip" id="progress-chip" hidden>
        <span id="progress-text">0 / 19</span>
        <span class="progress-track"><span class="progress-fill" id="progress-fill"></span></span>
      </div>
      <button class="btn ghost icon-btn" id="theme-toggle" title="Appearance" aria-label="Change appearance"><span class="msym">brightness_auto</span></button>
      <button class="btn ghost icon-btn" id="unit-toggle" title="Switch temperature units" aria-label="Switch temperature units">°F</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>

  <main id="main" tabindex="-1"></main>

  <footer class="foot">
    <p>Canotto Lab stores everything in this browser. Nothing leaves the device unless you export it.</p>
  </footer>

  <script type="module" src="src/app.js?v=b05e27a1"></script>
</body>
</html>
